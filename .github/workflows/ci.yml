name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: uvx ruff@0.16.8 check src tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: uv sync --locked --all-extras
      # VTK's offscreen window still needs an X server for its GLX context;
      # xvfb provides one and Mesa llvmpipe provides software rasterization.
      - run: command -v xvfb-run || sudo apt-get install -y xvfb
      - run: xvfb-run -a uv run pytest
        env:
          LIBGL_ALWAYS_SOFTWARE: 1

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      # CLI-only binary: the studio extra (VTK/ImGui) and native solver
      # bindings stay host-side, so the base lockfile is all this needs.
      - run: uv sync --locked
      - run: uv run --with pyinstaller pyinstaller --onefile --name jaam --paths src scripts/pyinstaller-entry.py
      - run: ./dist/jaam check examples/dipole.jaam
      - uses: actions/upload-artifact@v4
        with:
          name: jaam-linux-x86_64
          path: dist/jaam
      - name: Attach binary to tag release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" --generate-notes
          fi
          gh release upload "${{ github.ref_name }}" dist/jaam --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
